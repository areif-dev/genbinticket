<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Printable Labels</title>
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      .page {
        width: 8.5in;
        height: 11in;
        padding: 13.5mm 4.54mm 10.3mm 4.54mm;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-content: flex-start;
        box-sizing: border-box;
        page-break-after: always;
      }
      .label {
        position: relative;
        width: 2.625in;
        height: 1in;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-sizing: border-box;
        font-family: "Cascadia Code", "Courier New", Courier, monospace;
        overflow: hidden;
        margin-bottom: 0.1mm;
      }
      .price {
        position: absolute;
        top: 0.033in;
        left: 0.033in;
        max-width: 1.26in;
        max-height: 0.269in;
        font-family: "Cascadia Code", "Courier New", Courier, monospace;
        font-size: 0.267in;
        font-weight: bold;
        overflow: hidden;
      }
      .sku {
        position: absolute;
        top: 0.33in;
        left: 0.033in;
        max-width: 1.26in;
        max-height: 0.134in;
        font-family: "Cascadia Code", "Courier New", Courier, monospace;
        font-size: 0.133in;
        font-weight: bold;
        overflow: hidden;
      }
      .description {
        position: absolute;
        top: 0.47in;
        left: 0.033in;
        max-width: 2in;
        max-height: 0.118in;
        font-family: "Cascadia Code", "Courier New", Courier, monospace;
        font-size: 0.117in;
        font-weight: bold;
        overflow: hidden;
      }
      .ean13-text {
        position: absolute;
        top: 0.663in;
        left: 0.033in;
        max-width: 1.26in;
        font-family: "Cascadia Code", "Courier New", Courier, monospace;
        font-size: 0.083in;
      }
      .date {
        position: absolute;
        top: 0.885in;
        left: 0.81in;
        font-family: "Cascadia Code", "Courier New", Courier, monospace;
        font-size: 0.083in;
        max-width: 0.5in;
      }
      .qty {
        position: absolute;
        top: 0.885in;
        left: 1.5in;
        font-family: "Cascadia Code", "Courier New", Courier, monospace;
        font-size: 0.083in;
        max-width: 0.6in;
      }
      .small-text {
        font-family: "Cascadia Code", "Courier New", Courier, monospace;
        font-size: 0.083in;
      }
      .alt-code-box {
        position: absolute;
        display: block;
        top: 0.033in;
        left: 1.3in;
        max-height: 0.968in;
        max-width: 0.697in;
        overflow: hidden;
      }
      .barcode {
        position: absolute;
        top: 0.757in;
        left: 0.033in;
        height: 0.207in;
        width: 0.73in;
      }
      .product-image {
        position: absolute;
        top: 0in;
        left: 2in;
        height: 1in;
        max-width: 0.62in;
        overflow: hidden;
        object-fit: cover;
      }
    </style>
    <style media="screen">
      .sort-btn {
        display: inline;
      }
    </style>
    <style media="print">
      @page {
        margin: 0;
      }

      .sort-btn {
        display: none;
      }

      label {
        display: none;
      }
    </style>
  </head>
  <body>
    <label for="sort-group">Sort:</label>
    <input type="radio" class="sort-btn" id="sort-preserve" name="sort" value="preserve" checked />
    <label for="sort-preserve">Preserve</label>
    <input type="radio" class="sort-btn" id="sort-upc" name="sort" value="upc" />
    <label for="sort-upc">UPC</label>
    <input type="radio" class="sort-btn" id="sort-sku" name="sort" value="sku" />
    <label for="sort-sku">SKU</label>
    <input type="radio" class="sort-btn" id="sort-date" name="sort" value="date" />
    <label for="sort-date">Date</label>
    <section id="pages"></section>
  </body>
  <script>
    function e(name, attrs, children) {
      let elem = document.createElement(name);
      for (const attr in attrs) {
        if (attrs.hasOwnProperty(attr)) {
          elem.setAttribute(attr, attrs[attr]);
        }
      };
      console.log("Elem");
      console.log(elem);
      if (children) {
        children.forEach((child) => {
          console.log(child);
          if (typeof child === "string") {
            const textNode = document.createTextNode(child + "");
            elem.appendChild(textNode);
          } else {
            elem.appendChild(child);
          }
        });
      }
      return elem;
    }

    window.addEventListener("load", () => {
      let defaultOrder = [
        {% for page in pages %} 
          [
            {% for label in page %}
              {
              {% if label.sku %}
                sku: "{{ label.sku }}",
              {% endif %}
              {% if label.ean13 %}
                "ean13-text": "{{ label.ean13 | format_ean13 }}",
                barcode: "{{ label.ean13 | encode_barcode }}",
              {% endif %}
              {% if label.qty %}
                qty: "Qty: {{ label.qty }}",
              {% else %}
                qty: "Qty: N/A",
              {% endif %}
              {% if label.img %}
                img: "{{ label.img }}",
              {% endif %}
              {% if label.date %}
                date: "{{ label.date }}",
              {% endif %}
              {% if label.desc %}
                desc: "{{ label.desc }}",
              {% endif %}
              {% if label.price %}
                price: "{{ label.price | pretty_price }}",
              {% endif %}
                alt_skus: [
              {% for alt_sku in label.alt_skus %}
                "{{ alt_sku }}",
              {% endfor %}
              ]},
            {% endfor %}
          ],
        {% endfor %}
      ];
      displayPages(defaultOrder);
    });

    /**
     * Render the JSON labels in the HTML
     */
    function displayPages(pages) {
      document.querySelector("body").replaceChild(
        e(
          "section",
          { id: "pages" },
          pages.map((page) => {
            return e(
              "div",
              { class: "page" },
              page.map((label) => {
                let lab = e("div", { class: "label" }, []);
                for (const prop in label) {
                  if (label.hasOwnProperty(prop)) {
                    if (prop === "img") {
                      lab.appendChild(
                        e(
                          "img",
                          {
                            src: label.img,
                            alt: (label.desc || "Missing Desc") + " Img",
                          },
                          [],
                        ),
                      );
                    } else if (prop === "barcode") {
                      lab.appendChild(
                        e(
                          "img",
                          {
                            src: label.barcode,
                            alt: "Error while encoding",
                            class: "barcode",
                          },
                          [],
                        ),
                      );
                    } else if (prop === "alt_skus") {
                      lab.appendChild(
                        e(
                          "div",
                          { class: "alt-code-box" },
                          label.alt_skus.map((sku) => {
                            return e("div", { class: "small-text" }, [sku]);
                          }),
                        ),
                      );
                    } else {
                      lab.appendChild(e("div", { class: prop }, [label[prop] || "Missing",]));
                    }
                  }
                }
                return lab;
              }),
            );
          }),
        ),
        document.querySelector("#pages"),
      );
    }
</script>
</html>
