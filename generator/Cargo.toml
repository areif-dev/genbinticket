[package]
name = "generator"
version = "0.2.0"
edition = "2024"

[dependencies]
barcoders = { version = "2.0.0", features = ["image"] }
base64 = "0.22.1"
chrono = "0.4.41"
clap = { version = "4.5.40", features = ["derive"] }
image = "0.25.6"
ean13 = { git = "https://github.com/areif-dev/ean13", version = "0.4.0" }
minijinja = { version = "2.10.2", features = ["loader"] }
rust_decimal = "1.37.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
