[package]
name = "genbinticket"
version = "0.2.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.4", features = ["query"] }
barcoders = { version = "2.0.0", features = ["image"] }
base64 = "0.22.1"
chrono = "0.4.41"
clap = { version = "4.5.40", features = ["derive"] }
csv = "1.3.1"
dotenvy = "0.15.7"
ean13 = { git = "https://github.com/areif-dev/ean13", version = "0.4.0" }
minijinja = { version = "2.11.0", features = ["loader"] }
rust_decimal = "1.37.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["full"] }
tower-http = { version = "0.6.6", features = ["fs"] }
vendor-controller = { version = "0.5.1", path = "../vendor-control/vendor-controller" }
vendor-controllers = { version = "0.1.0", path = "../vendor-control/vendor-controllers" }
webbrowser = "1.0.5"
