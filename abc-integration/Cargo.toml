[package]
name = "abc-integration"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.4", features = ["query"] }
chrono = "0.4.41"
clap = { version = "4.5.40", features = ["derive"] }
csv = "1.3.1"
generator = { version = "0.2.0", path = "../generator" }
inventory-utils = { git = "https://github.com/areif-dev/inventory-utils", version = "0.3.2" }
reqwest = { version = "0.12.20", features = ["blocking"] }
rust_decimal = "1.37.2"
serde = "1.0.219"
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["full"] }
webbrowser = "1.0.5"
